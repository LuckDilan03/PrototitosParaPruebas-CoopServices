<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECUPERAR CONTRASEÑA - PASO 2</title>
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="./css/registro2.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- Favicon -->
    <link href="images/favicon.ico" rel="icon">

    <script src="./js/recuperarContrasena.js" defer></script>
</head>
<body>
    <div class="form-container">
        <h1>RECUPERAR CONTRASEÑA</h1>
        <form class="formulario" id="formulario-recuperar-contrasena-2">
            <label for="NuevaContrasena" class="sr-only">NUEVA CONTRASEÑA</label>
            <input type="password" name="NuevaContrasena" id="NuevaContrasena" placeholder="NUEVA CONTRASEÑA" autocomplete="new-password">
            <i class="formulario__validacion-estado fas fa-times-circle"></i>

            <label for="VerificarContrasena" class="sr-only">VERIFICAR CONTRASEÑA</label>
            <input type="password" name="VerificarContrasena" id="VerificarContrasena" placeholder="VERIFICAR CONTRASEÑA" autocomplete="new-password">
            <i class="formulario__validacion-estado fas fa-times-circle"></i>
            
            <button type="submit">CAMBIAR CONTRASEÑA</button>
            <button type="button" class="boton-volver" onclick="window.location.href = '/'">VOLVER AL INICIO</button>
        </form>
        <p>MENSAJE ¿CUAL? NO SE - <a href="/iniciarSesion">INICIA SESIÓN</a></p>

    </div>
</body>
</html>
