<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECUPERAR CONTRASEÑA - PASO 1</title>
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="./css/registro2.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- Favicon -->
    <link href="images/favicon.ico" rel="icon">

    
</head>
<body>
    <div class="form-container">
        <h1>RECUPERAR CONTRASEÑA</h1>
        <form class="formulario" id="formulario-recuperar-contrasena-1">
            <label for="dni" class="sr-only">DOCUMENTO DE IDENTIDAD</label>
            <input type="number" name="dni" id="dni" placeholder="DOCUMENTO DE IDENTIDAD" autocomplete="current-documento">
            <i class="formulario__validacion-estado fas fa-times-circle"></i>

            <label for="Usuario" class="sr-only">USUARIO</label>
            <input type="text" name="Usuario" id="Usuario" placeholder="USUARIO" autocomplete="current-usuario">
            <i class="formulario__validacion-estado fas fa-times-circle"></i>

            <button type="button" id="boton-enviar">ENVIAR</button>
            <button type="button" class="boton-volver" onclick="window.location.href = '/iniciarSesion'">VOLVER A INICIAR SESIÓN</button>
        </form>
        <p>¿AÚN NO ERES ASOCIADO? - <a href="/registrarse">¡REGÍSTRATE AHORA!</a></p>

    </div>
    <script src="/js/recuperarContra.js"></script>
</body>
</html>
